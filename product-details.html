<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #fff;
    }

    /* Container Grid Layout */
    .product-detail-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
    }

    /* Breadcrumb Styling */
    .breadcrumb {
      grid-column: 1 / -1;
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }

    .breadcrumb a {
      color: #888;
      text-decoration: none;
    }

    .breadcrumb .active {
      color: #8a1548;
    }

    /* Image Gallery & Zoom */
    .product-gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-image {
      width: 100%;
      max-width: 400px;
      height: 400px;
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
      cursor: zoom-in;
      border: 1px solid #f0f0f0;
      border-radius: 4px;
    }

    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
      transform-origin: center center;
    }

    /* Hover Zoom Effect */
    .main-image:hover img {
      transform: scale(2);
    }

    .thumbnail-grid {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .thumbnail-grid img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: border-color 0.2s;
      border-radius: 4px;
    }

    .thumbnail-grid img:hover,
    .thumbnail-grid img.active-thumb {
      border-color: #8a1548;
    }

    /* Product Info Section */
    .product-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .product-info h1 {
      font-family: 'Georgia', serif;
      font-size: 28px;
      font-weight: normal;
      color: #222;
      margin-bottom: 15px;
    }

    .product-info .price {
      font-size: 26px;
      color: #8a1548;
      margin-bottom: 15px;
    }

    .product-info .vendor-info {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    .product-info .availability {
      font-family: 'Georgia', serif;
      font-size: 15px;
      color: #333;
      margin-bottom: 25px;
    }

    /* Quantity Controls */
    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #8a1548;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quantity-selector input {
      width: 40px;
      height: 32px;
      text-align: center;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    /* Actions & Buttons */
    .btn-add-cart {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      background-color: #fff;
      border: 1px solid #8a1548;
      color: #8a1548;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s;
    }

    .btn-add-cart:hover {
      background-color: #fdf2f6;
    }

    .btn-shop-pay {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      background-color: #5a31f4;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .more-options {
      font-size: 13px;
      color: #666;
      text-decoration: underline;
      margin-bottom: 25px;
      cursor: pointer;
    }

    /* Trust Badges */
    .trust-badges {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
    }

    .badge-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Full Screen Lightbox Modal */
    .lightbox-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }

    .lightbox-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .product-detail-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="product-detail-container">
    <div class="breadcrumb">
      <a href="index.html">Home</a> | <a href="index.html">Shop</a> | <a href="index.html">Papad, Noodles and Vermicelli</a> | <span class="active" id="breadcrumb-title">Multi Millet Pasta - 350 grams</span>
    </div>

    <div class="product-gallery">
      <!-- Main Hover Zoomable Image -->
      <div class="main-image" id="main-image-container">
        <img id="product-img" src="https://www.theinternationalfoodstore.com/cdn/shop/files/multivermicelli_220x.jpg?v=1693573299" alt="Product Image">
      </div>
      <div class="thumbnail-grid">
        <img class="thumb-img active-thumb" src="https://www.theinternationalfoodstore.com/cdn/shop/files/multivermicelli_220x.jpg?v=1693573299" alt="Front">
        <img class="thumb-img" src="https://www.theinternationalfoodstore.com/cdn/shop/files/finger_millet_pasta_220x.jpg?v=1772720360" alt="Back">
      </div>
    </div>

    <div class="product-info">
      <h1 id="product-title">Multi Millet Pasta - 350 grams</h1>
      <div class="price" id="product-price">£3.50</div>
      <div class="vendor-info" id="product-vendor">Farm Bandi</div>
      <div class="availability">Available Now!</div>

      <div class="quantity-selector">
        <button class="qty-btn" id="btn-minus">-</button>
        <input type="text" id="qty-input" value="1" readonly>
        <button class="qty-btn" id="btn-plus">+</button>
      </div>

      <button class="btn-add-cart">Add to Cart</button>
      <button class="btn-shop-pay">Buy with shop</button>
      <a class="more-options">More payment options</a>

      <div class="trust-badges">
        <div class="badge-item">🛡️ Secure Payment</div>
        <div class="badge-item">🚚 Free Shipping</div>
      </div>
    </div>
  </div>

  <!-- Fullscreen Modal -->
  <div class="lightbox-modal" id="lightbox">
    <span class="lightbox-close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Full Screen Product Image">
  </div>

  <script>
    // 1. URL Parameter Parsing
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name');
    const price = params.get('price');
    const vendor = params.get('vendor');
    const img = params.get('img');

    if (name) {
      document.getElementById('product-title').textContent = name;
      document.getElementById('breadcrumb-title').textContent = name;
    }
    if (price) document.getElementById('product-price').textContent = price;
    if (vendor) document.getElementById('product-vendor').textContent = vendor;
    if (img) {
      document.getElementById('product-img').src = img;
      document.querySelectorAll('.thumb-img')[0].src = img;
    }

    // 2. Hover Zoom Position Handler
    const imgContainer = document.getElementById('main-image-container');
    const mainImg = document.getElementById('product-img');

    imgContainer.addEventListener('mousemove', (e) => {
      const rect = imgContainer.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      mainImg.style.transformOrigin = `${x}% ${y}%`;
    });

    // 3. Fullscreen Lightbox Trigger
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    imgContainer.addEventListener('click', () => {
      lightboxImg.src = mainImg.src;
      lightbox.style.display = 'flex';
    });

    document.getElementById('lightbox-close').addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target !== lightboxImg) {
        lightbox.style.display = 'none';
      }
    });

    // 4. Quantity Controls
    const qtyInput = document.getElementById('qty-input');
    document.getElementById('btn-minus').addEventListener('click', () => {
      let val = parseInt(qtyInput.value);
      if (val > 1) qtyInput.value = val - 1;
    });
    document.getElementById('btn-plus').addEventListener('click', () => {
      let val = parseInt(qtyInput.value);
      qtyInput.value = val + 1;
    });

    // 5. Thumbnail Switcher
    const thumbs = document.querySelectorAll('.thumb-img');
    thumbs.forEach(thumb => {
      thumb.addEventListener('click', function() {
        thumbs.forEach(t => t.classList.remove('active-thumb'));
        this.classList.add('active-thumb');
        mainImg.src = this.src;
      });
    });
  </script>
</body>
</html>
